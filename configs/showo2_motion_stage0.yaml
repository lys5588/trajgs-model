# UniMotion Training Configuration - Stage 0 (LoRA rank=32)
# Paper: Stage 0 - Latent Representation Alignment (LRA).
# Task: motion-to-motion self-reconstruction (m2m) with temporal bottleneck
# augmentation on HumanML3D + H36M + MotionFix. The Show-o2 LLM backbone and all
# image modules are frozen; only the motion modules, the newly added motion token
# embeddings and LoRA-B (motion-token path of the Modality-Routed LoRA) are trained.

wandb:
  entity: null
  resume: 'auto'

experiment:
    project: "unimotion"
    name: "unimotion-stage0"
    output_dir: "outputs/unimotion-stage0"
    save_every: 100000
    generate_every: 30000
    log_every: 50
    log_grad_norm_every: 1000
    resume_from_checkpoint: 'latest'
    checkpoints_total_limit: 16

model:
    weight_type: "bfloat16"

    vae_model:
        type: "wan21"
        pretrained_model_path: "Wan2.1_VAE.pth"

    motion_vae:
        pretrained_model_path: "pretrained/cma_vae.ckpt"
        motion_latent_dim: 256
        motion_nfeats: 269
        downsample_rate: 4

    showo:
        model_name: "Showo2WithMotion"
        load_from_showo: True
        embedding_train_policy: "required"
        pretrained_model_path: "showlab/show-o2-1.5B"
        llm_model_path: "Qwen/Qwen2.5-1.5B-Instruct"
        llm_vocab_size: null
        hidden_size: 1536

        image_latent_dim: 16
        image_latent_height: 27
        image_latent_width: 27
        hq_image_latent_height: 64
        hq_image_latent_width: 64
        mixed_modal_latent_height: 27
        mixed_modal_latent_width: 27
        patch_size: 2
        num_diffusion_layers: 10
        clip_latent_dim: 1152
        add_qk_norm: True
        add_time_embeds: True
        clip_pretrained_model_path: "google/siglip-so400m-patch14-384"

        motion_latent_dim: 256
        motion_nfeats: 269
        motion_downsample_rate: 4
        max_motion_length: 500
        num_motion_diffusion_layers: 6
        motion_semantic_dim: 512
        num_motion_semantic_layers: 4

        # Keep freezing policy aligned with Stage1
        frozen_params: ['showo',
                       'image_embedder_und', 'image_embedder_gen', 'und_trans',
                       'position_embedding', 'fusion_proj',
                       'diffusion_head_a',
                       'diffusion_head_b']
        params_not_load: null

    gradient_checkpointing: True

dataset:
    tasks: ['m2m']

    motion:
        data_root: "data/UNI_MOTION_269/HumanML3D"
        latent_dir: null
        max_motion_length: 200
        min_motion_length: 20
        unit_length: 1
        fps: 20
        downsample_rate: 4
        motion_latent_dim: 256

    motion_recon:
        instruction_template_path: "instructions/template_m2m_recon_stage0.json"

        sample_weights:
            humanml3d: 2
            h36m: 1
            motionfix: 1

        humanml3d:
            data_root: "data/UNI_MOTION_269/HumanML3D"
            max_motion_length: 200
            min_motion_length: 20

        h36m:
            data_root: "data/UNI_MOTION_269/H36M"
            max_motion_length: 1
            min_motion_length: 1

        motionfix:
            data_root: "data/UNI_MOTION_269/MotionFix"
            max_motion_length: 200
            min_motion_length: 20
            use_target_only: true

        bottleneck:
            temporal_keep_ratio_min: 0.2
            temporal_keep_ratio_max: 0.5
            feature_drop_prob: 0.15
            noise_std: 0.02

    params:
        num_workers: 4
        pin_memory: True
        persistent_workers: True

    preprocessing:
        max_seq_length: 512
        max_motion_tokens: 50
        max_text_len: 256

training:
    stage: "lm_instruct"
    instruction_type: "all"
    instruction_template_path: "instructions/template_pretrain.json"

    gradient_accumulation_steps: 8
    batch_size_m2m: 2
    batch_size_t2m: 2
    batch_size_m2t: 2
    batch_size_pred: 0
    batch_size_edit: 0
    batch_size_t2t: 0
    batch_size_img2pose: 0
    batch_size_img2text: 0
    mixed_precision: "bf16"
    enable_tf32: True
    seed: 42
    max_train_steps: 800000
    cond_dropout_prob: 0.1
    label_smoothing: 0.0
    max_grad_norm: 1.0
    ntp_coeff: 1.0
    flow_coeff: 0.8
    und_max_t0: 1.0

    # Stage 0 trains m2m only
    m2m_ratio: 1.0

optimizer:
    name: adamw
    params:
        learning_rate: 0.00006
        scale_lr: False
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.0
        epsilon: 1e-8

lr_scheduler:
    scheduler: "constant_with_warmup"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 2000

transport:
    path_type: "Linear"
    prediction: "velocity"
    loss_weight: null
    train_eps: null
    sample_eps: null
    snr_type: "lognorm"
    sampling_method: "euler"
    guidance_scale: 3.0
    num_inference_steps: 50
    atol: 1e-6
    rtol: 1e-3
    reverse: False
    do_shift: True
    time_shifting_factor: 3.0

lora:
    enabled: true
    rank_A: 32
    rank_B: 32
    alpha: 32
    dropout: 0.0
    enable_A: false
    enable_B: true
    train_B: true          # LoRA-B is kept for cross-stage load/save continuity and is trained in this stage
    learning_rate: 0.00006
    target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
