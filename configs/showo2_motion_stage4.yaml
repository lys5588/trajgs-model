# UniMotion Training Configuration - Stage 4 (LoRA rank=32)
# Paper: Stage 3 - joint fine-tuning on all downstream tasks (m2m excluded).
# Tasks: t2m + m2t + pred + t2t + edit + img2pose + img2text.
# Training style follows the final stage of MotionGPT3 (lm_finetune + witht2t templates).
# Initialized from a Stage 3 checkpoint
# (outputs/unimotion-stage3/checkpoint-120000; override
# model.showo.pretrained_model_path to use a different Stage 3 checkpoint).
#
# LoRA strategy (Paper: Modality-Routed LoRA):
#   - LoRA-A (text/image-token path): trained
#   - LoRA-B (motion-token path): created and loaded, but frozen (train_B=false)
#   - Purpose: preserve the cross-stage LoRA chain so training can continue stage by stage

wandb:
  entity: null
  resume: 'auto'

experiment:
    project: "unimotion"
    name: "unimotion-stage4"
    output_dir: "outputs/unimotion-stage4"
    save_every: 20000
    generate_every: 50000
    log_every: 50
    log_grad_norm_every: 1000
    resume_from_checkpoint: 'latest'
    checkpoints_total_limit: 20

model:
    weight_type: "bfloat16"

    vae_model:
        type: "wan21"
        pretrained_model_path: "Wan2.1_VAE.pth"

    motion_vae:
        pretrained_model_path: "pretrained/cma_vae.ckpt"
        motion_latent_dim: 256
        motion_nfeats: 269
        downsample_rate: 4

    showo:
        model_name: "Showo2WithMotion"
        load_from_showo: False  # continue from Stage 3
        embedding_train_policy: "disabled"
        pretrained_model_path: "outputs/unimotion-stage3/checkpoint-120000"
        llm_model_path: "Qwen/Qwen2.5-1.5B-Instruct"
        llm_vocab_size: null
        hidden_size: 1536

        image_latent_dim: 16
        image_latent_height: 27
        image_latent_width: 27
        hq_image_latent_height: 64
        hq_image_latent_width: 64
        mixed_modal_latent_height: 27
        mixed_modal_latent_width: 27
        patch_size: 2
        num_diffusion_layers: 10
        clip_latent_dim: 1152
        add_qk_norm: True
        add_time_embeds: True
        clip_pretrained_model_path: "google/siglip-so400m-patch14-384"

        motion_latent_dim: 256
        motion_nfeats: 269
        motion_downsample_rate: 4
        max_motion_length: 500
        num_motion_diffusion_layers: 6
        motion_semantic_dim: 512
        num_motion_semantic_layers: 4
        pose_branch:
            enabled: true
            ckpt_path: "deps/pose/tokenhmr_model.ckpt"
            strict_ckpt: true
            apply_tasks: ['img2pose', 'img2text', 'mgie']
            freeze_backbone: true
            run_with_no_grad: true
            input_size: 256
            crop_width: 192
            feature_dim: 1280
            target_tokens_hw: [27, 27]

        # Stage 4 trainable-parameter policy
        # Frozen: Qwen LLM backbone + heavy vision encoder path + image generation heads
        # Trained: motion path + image_embedder_und + fusion_proj + LoRA-A
        frozen_params: ['showo',
                       'und_trans',
                       'position_embedding',
                       'image_embedder_gen',
                       'diffusion_head_a',
                       'diffusion_head_b']
        params_not_load: null

    gradient_checkpointing: True

dataset:
    # Stage 4 downstream tasks (m2m explicitly excluded)
    tasks: ['t2m', 'm2t', 'pred', 't2t', 'edit', 'img2pose', 'img2text']

    # Number of image tokens (WAN21 VAE 432 -> 54, patch_size=2 -> 27*27=729)
    num_image_tokens: 729
    image_resolution: 432

    motion:
        data_root: "data/UNI_MOTION_269/HumanML3D"
        latent_dir: null
        max_motion_length: 200
        min_motion_length: 20
        unit_length: 1
        fps: 20
        downsample_rate: 4
        motion_latent_dim: 256
        predict_ratio: 0.2

    motion_edit:
        data_root: "data/UNI_MOTION_269/MotionFix"
        instruction_template_path: "instructions/template_edit_instructions.json"

    h36m:
        data_root: "data/UNI_MOTION_269/H36M"
        image_root: "data/Human3.6M_MMPose/processed/images_fps50_cropped_448x448"
        instruction_template_path: "instructions/img_template_instructions.json"

    params:
        num_workers: 4
        pin_memory: True
        persistent_workers: True

    preprocessing:
        max_seq_length: 832
        max_motion_tokens: 50
        max_text_len: 192

training:
    stage: "lm_finetune"
    instruction_type: "witht2t"
    instruction_template_path: "instructions/template_witht2t_instructions.json"

    gradient_accumulation_steps: 8
    batch_size_t2m: 2
    batch_size_m2t: 2
    batch_size_pred: 2
    batch_size_t2t: 2
    batch_size_edit: 2
    batch_size_img2pose: 2
    batch_size_img2text: 2
    mixed_precision: "bf16"
    enable_tf32: True
    seed: 42
    max_train_steps: 200000
    cond_dropout_prob: 0.1
    label_smoothing: 0.0
    max_grad_norm: 1.0
    ntp_coeff: 1.0
    flow_coeff: 0.8
    und_max_t0: 1.0
    img2pose_project_constant_dims: true
    img2pose_decode067_supervision:
        enabled: false
        weight: 0.1
        dims: 67
        loss_type: smooth_l1
        warmup_steps: 5000
        debug_every: 0

    # Stage 4 task sampling ratios (sum=1.0)
    t2m_ratio: 0.28
    m2t_ratio: 0.14
    pred_ratio: 0.08
    t2t_ratio: 0.10
    edit_ratio: 0.15
    img2pose_ratio: 0.17
    img2text_ratio: 0.08

optimizer:
    name: adamw
    params:
        learning_rate: 0.00003
        scale_lr: False
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.0
        epsilon: 1e-8

lr_scheduler:
    scheduler: "constant_with_warmup"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 4000

transport:
    path_type: "Linear"
    prediction: "velocity"
    loss_weight: null
    train_eps: null
    sample_eps: null
    snr_type: "lognorm"
    sampling_method: "euler"
    guidance_scale: 3.0
    num_inference_steps: 50
    atol: 1e-6
    rtol: 1e-3
    reverse: False
    do_shift: True
    time_shifting_factor: 3.0

# ==================== Token-Level LoRA (Paper: Modality-Routed LoRA) ====================
# Stage 4: LoRA-A trained; LoRA-B kept but frozen.
# Note: enable_B=true creates the B branch and preserves cross-stage load/save continuity.
lora:
    enabled: true
    rank_A: 32
    rank_B: 32
    alpha: 32
    dropout: 0.0
    enable_A: true
    enable_B: true
    train_B: false
    learning_rate: 0.00003
    target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
