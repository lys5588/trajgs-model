# UniMotion Training Configuration - Stage 1 (LoRA rank=32)
# Paper: Stage 1a - Text-to-Motion warmup.
# Task: T2M only (lm_pretrain, no instruction template).
# Learning rate: 8e-5.
# Initialized from the Stage 0 checkpoint (outputs/unimotion-stage0/checkpoint-800000).
#
# Frozen parameters:
#   - showo: the Qwen LLM backbone is fully frozen
#   - image_embedder_und/gen, und_trans, position_embedding, fusion_proj: image-related modules
#   - diffusion_head_a, diffusion_head_b: image diffusion heads
#
# Trainable parameters:
#   - Motion input path (motion_embedder, Paper: Dual-Path Embedder)
#   - Motion Diffusion Head (motion_diffusion_head_a/b, Paper: Flow Head)
#   - Shared diffusion components (time_embed, diff_proj, time_embed_proj)
#
# LoRA (Paper: Modality-Routed LoRA):
#   - LoRA-A (text/image-token path): OFF
#   - LoRA-B (motion-token path): ON, trained (rank=32)

wandb:
  entity: null
  resume: 'auto'

experiment:
    project: "unimotion"
    name: "unimotion-stage1"
    output_dir: "outputs/unimotion-stage1"
    save_every: 20000
    generate_every: 30000
    log_every: 50
    log_grad_norm_every: 1000
    resume_from_checkpoint: 'latest'
    checkpoints_total_limit: 16

model:
    weight_type: "bfloat16"

    # Image/Video VAE (unchanged from Show-o2)
    vae_model:
        type: "wan21"
        pretrained_model_path: "Wan2.1_VAE.pth"

    # CMA Motion VAE (269-dim features, downsample_rate=4)
    motion_vae:
        pretrained_model_path: "pretrained/cma_vae.ckpt"
        motion_latent_dim: 256
        motion_nfeats: 269
        downsample_rate: 4

    # Show-o2 main model
    showo:
        model_name: "Showo2WithMotion"
        load_from_showo: False
        embedding_train_policy: "required"
        pretrained_model_path: "outputs/unimotion-stage0/checkpoint-800000"
        llm_model_path: "Qwen/Qwen2.5-1.5B-Instruct"
        llm_vocab_size: null
        hidden_size: 1536

        # Image/video settings
        image_latent_dim: 16
        image_latent_height: 27
        image_latent_width: 27
        hq_image_latent_height: 64
        hq_image_latent_width: 64
        mixed_modal_latent_height: 27
        mixed_modal_latent_width: 27
        patch_size: 2
        num_diffusion_layers: 10
        clip_latent_dim: 1152
        add_qk_norm: True
        add_time_embeds: True
        clip_pretrained_model_path: "google/siglip-so400m-patch14-384"

        # Motion settings (269-dim features, downsample_rate=4)
        motion_latent_dim: 256
        motion_nfeats: 269
        motion_downsample_rate: 4
        max_motion_length: 500
        num_motion_diffusion_layers: 6
        # Dual-Path Motion Embedder settings
        motion_semantic_dim: 512       # motion semantic feature dimension
        num_motion_semantic_layers: 4  # number of motion semantic Transformer layers
        pose_branch:
            enabled: false
            ckpt_path: "deps/pose/tokenhmr_model.ckpt"
            strict_ckpt: true
            apply_tasks: ['img2pose']
            freeze_backbone: true
            run_with_no_grad: true
            input_size: 256
            crop_width: 192
            feature_dim: 1280
            target_tokens_hw: [27, 27]

        # Stage 1 freezing policy
        # Frozen: Qwen LLM backbone (showo) + image/video-related layers
        # Trained: motion input path + motion diffusion head + shared diffusion components
        frozen_params: ['showo',  # Qwen LLM backbone fully frozen
                       'image_embedder_und', 'image_embedder_gen', 'und_trans',
                       'position_embedding', 'fusion_proj',
                       'diffusion_head_a',  # image diffusion head
                       'diffusion_head_b']  # image diffusion head
        params_not_load: null

    gradient_checkpointing: True

dataset:
    # Stage 1: T2M only
    tasks: ['t2m']

    motion:
        data_root: "data/UNI_MOTION_269/HumanML3D"
        latent_dir: null  # no precomputed latents; motions are encoded on the fly by the VAE
        max_motion_length: 200
        min_motion_length: 20
        unit_length: 1
        fps: 20
        downsample_rate: 4
        motion_latent_dim: 256

    params:
        num_workers: 4
        pin_memory: True
        persistent_workers: True

    preprocessing:
        max_seq_length: 512
        max_motion_tokens: 50
        max_text_len: 256

# Stage 1 training settings
training:
    # Training stage identifier
    stage: "lm_pretrain"
    instruction_type: "t2m"
    instruction_template_path: null  # Stage 1 does not use an instruction template

    gradient_accumulation_steps: 8
    batch_size_t2m: 2
    batch_size_m2t: 0
    mixed_precision: "bf16"
    enable_tf32: True
    seed: 42
    max_train_steps: 400000
    cond_dropout_prob: 0.1  # CFG condition dropout
    label_smoothing: 0.0
    max_grad_norm: 1.0
    ntp_coeff: 1.0
    flow_coeff: 0.8
    und_max_t0: 1.0

    # Stage 1: T2M only
    t2m_ratio: 1.0  # 100% T2M
    ddp_find_unused_parameters: false  # single task; disable to reduce DDP overhead and warnings

optimizer:
    name: adamw
    params:
        learning_rate: 0.00008
        scale_lr: False
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.0
        epsilon: 1e-8

lr_scheduler:
    scheduler: "constant_with_warmup"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 4000

transport:
    path_type: "Linear"
    prediction: "velocity"
    loss_weight: null
    train_eps: null
    sample_eps: null
    snr_type: "lognorm"
    sampling_method: "euler"
    guidance_scale: 3.0
    num_inference_steps: 50
    atol: 1e-6
    rtol: 1e-3
    reverse: False
    do_shift: True
    time_shifting_factor: 3.0

# ==================== Token-Level LoRA (Paper: Modality-Routed LoRA) ====================
# Stage 1 r32: only LoRA-B (motion-token path) is enabled;
# LoRA-A (text/image-token path) is off.
lora:
    enabled: true
    rank_A: 32              # LoRA rank for the text/image-token path (not enabled here)
    rank_B: 32              # LoRA rank for the motion-token path
    alpha: 32               # LoRA alpha
    dropout: 0.0            # LoRA dropout
    enable_A: false         # Stage 1: text/image-token path OFF
    enable_B: true          # Stage 1: motion-token path ON (kept for cross-stage load/save continuity)
    train_B: true           # set explicitly to avoid implicit default drift
    learning_rate: 0.00008  # LoRA learning rate
    target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
