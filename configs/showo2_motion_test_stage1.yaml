# UniMotion T2M Test Configuration - Stage 1
# Evaluates a Stage 1 (paper Stage 1a, T2M-only) model on HumanML3D text-to-motion.
# Consistent with the training configs: 269-dim features, downsample_rate=4.
#
# NOTE: this entry evaluates one (the primary) caption per test motion.
# The official paper T2M protocol uses the all-captions entry instead:
#   test_t2m_allcaps.py + configs/showo2_motion_test_stage4.yaml
#
# Usage:
#   python test_stage1.py config=configs/showo2_motion_test_stage1.yaml
#
#   # With custom checkpoint:
#   python test_stage1.py config=configs/showo2_motion_test_stage1.yaml \
#       test.model_path=outputs/unimotion-stage1/checkpoint-340000

wandb:
  entity: null
  resume: false

experiment:
    project: "unimotion"
    name: "unimotion-stage1-eval"
    output_dir: "outputs/stage1_eval"

model:
    weight_type: "bfloat16"

    # Image/Video VAE (unchanged from Show-o2)
    vae_model:
        type: "wan21"
        pretrained_model_path: "Wan2.1_VAE.pth"

    # CMA Motion VAE (269-dim features, downsample_rate=4)
    motion_vae:
        pretrained_model_path: "pretrained/cma_vae.ckpt"
        motion_latent_dim: 256
        motion_nfeats: 269
        downsample_rate: 4

    # Show-o2 main model
    showo:
        model_name: "Showo2WithMotion"
        load_from_showo: False
        pretrained_model_path: "outputs/unimotion-stage1/checkpoint-340000"
        llm_model_path: "Qwen/Qwen2.5-1.5B-Instruct"
        llm_vocab_size: null
        hidden_size: 1536

        # Image/video settings
        image_latent_dim: 16
        image_latent_height: 27
        image_latent_width: 27
        hq_image_latent_height: 64
        hq_image_latent_width: 64
        mixed_modal_latent_height: 27
        mixed_modal_latent_width: 27
        patch_size: 2
        num_diffusion_layers: 10
        clip_latent_dim: 1152
        add_qk_norm: True
        add_time_embeds: True
        clip_pretrained_model_path: "google/siglip-so400m-patch14-384"

        # Motion settings (269-dim features, downsample_rate=4)
        motion_latent_dim: 256
        motion_nfeats: 269
        motion_downsample_rate: 4
        max_motion_length: 500
        num_motion_diffusion_layers: 6
        # Dual-Path Motion Embedder settings
        motion_semantic_dim: 512       # motion semantic feature dimension
        num_motion_semantic_layers: 4  # number of motion semantic Transformer layers
        pose_branch:
            enabled: false
            ckpt_path: "deps/pose/tokenhmr_model.ckpt"
            strict_ckpt: true
            apply_tasks: ['img2pose']
            freeze_backbone: true
            run_with_no_grad: true
            input_size: 256
            crop_width: 192
            feature_dim: 1280
            target_tokens_hw: [27, 27]

        frozen_params: null
        params_not_load: null

dataset:
    motion:
        # Unified 269-dim data (UNI_MOTION_269).
        # GT motions are truncated to 263 dims for evaluator normalization.
        data_root: "data/UNI_MOTION_269/HumanML3D"
        latent_dir: null  # no precomputed latents needed for testing
        max_motion_length: 196
        min_motion_length: 40
        unit_length: 1
        fps: 20
        downsample_rate: 4
        motion_latent_dim: 256

    params:
        num_workers: 4
        pin_memory: True

    preprocessing:
        max_seq_length: 512
        max_motion_tokens: 49
        max_text_len: 256  # max_text_len for model input
        eval_max_text_len: 20  # max_text_len for evaluation, consistent with HumanML3D

# Test settings
test:
    # Model checkpoint path.
    # Default: the Stage 1a (T2M) reference checkpoint; see
    # showo2_motion_test_stage4.yaml for the reference protocol.
    model_path: "outputs/unimotion-stage1/checkpoint-340000"

    # Output directory
    output_dir: "outputs/stage1_eval"

    # Test parameters (consistent with MotionGPT3)
    # Recommended batch size: 32 single-GPU, 16-32 per GPU multi-GPU
    batch_size: 32
    num_samples: null  # null = use all test samples (full test set)
    # Quick test mode: randomly sample a subset (fixed seed, reproducible)
    quick: False
    num_quick_samples: 512
    replication_times: 1  # number of evaluation repetitions, reported as mean +/- 95% CI (MotionGPT3 default: 20)
    max_motion_length: 196
    min_motion_length: 40
    use_gt_length: True  # generate with the GT motion length

    # T2M task settings
    t2m:
        guidance_scale: 5.0
        num_inference_steps: 50

    # T2M evaluator path
    t2m_evaluator_path: "deps/t2m/t2m"

    # GloVe word vectors path
    glove_dir: "deps/glove/glove"

    # Mean/Std used for evaluation (consistent with the T2M evaluator)
    # Note: the evaluator expects 263-dim features, so the original mean/std are used
    mean_eval_path: "deps/t2m/t2m/Comp_v6_KLD01/meta/mean.npy"
    std_eval_path: "deps/t2m/t2m/Comp_v6_KLD01/meta/std.npy"

    # Device
    device: "cuda"
    seed: 42

    save_vis:
        enabled: false
        root_dir: "outputs/save_vis"
        save_all_replications: false

    # Debug mode (truncates to a tiny dataset; only for code debugging)
    tiny: False

# Transport settings (for generation)
transport:
    path_type: "Linear"
    prediction: "velocity"
    loss_weight: null
    train_eps: null
    sample_eps: null
    snr_type: "lognorm"
    sampling_method: "euler"
    guidance_scale: 3.0
    num_inference_steps: 50
    atol: 1e-6
    rtol: 1e-3
    reverse: False
    do_shift: True
    time_shifting_factor: 3.0

# Training settings are not used at test time; kept for compatibility
training:
    stage: "test"
    gradient_accumulation_steps: 1
    batch_size_t2m: 4
    batch_size_m2t: 0
    mixed_precision: "bf16"
    enable_tf32: True
    seed: 42
    max_train_steps: 0

# ==================== Token-Level LoRA (Paper: Modality-Routed LoRA) ====================
# The LoRA config at test time must match the one used in training
lora:
    enabled: true
    rank_A: 32              # LoRA rank for the text/image-token path
    rank_B: 32              # LoRA rank for the motion-token path
    alpha: 32               # LoRA alpha
    dropout: 0.0            # no dropout at test time
    enable_A: false         # Stage 1: text/image-token path OFF
    enable_B: true          # Stage 1: motion-token path ON
    target_modules:         # attention modules with LoRA applied
        - q_proj
        - k_proj
        - v_proj
        - o_proj
